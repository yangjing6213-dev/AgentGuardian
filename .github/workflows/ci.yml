name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Detect testable tree
        id: testable_tree
        shell: pwsh
        run: |
          $required = @("pyproject.toml", "requirements-dev.lock", "src", "tests")
          $ready = ($required | Where-Object { -not (Test-Path -LiteralPath $_) }).Count -eq 0
          "ready=$($ready.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          if (-not $ready -and $env:GITHUB_REF -notin @(
            "refs/heads/main",
            "refs/heads/agent/design-baseline"
          )) {
            Write-Error "Required test inputs are missing."
            exit 1
          }
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        if: steps.testable_tree.outputs.ready == 'true'
        with:
          python-version: '3.12'
          cache: pip
      - name: Install
        if: steps.testable_tree.outputs.ready == 'true'
        run: |
          python -m pip install --require-hashes -r requirements-dev.lock
          python -m pip install --require-hashes -r requirements-build.lock
          python -c "import setuptools.build_meta; print(setuptools.__version__)"
          python -m pip install --no-build-isolation --no-deps -e .
      - name: Full test suite
        if: steps.testable_tree.outputs.ready == 'true'
        shell: pwsh
        run: |
          if (Get-Command rtk -ErrorAction SilentlyContinue) {
            rtk pytest -q
          } else {
            python -m pytest -q
          }
      - name: Brand validator
        if: steps.testable_tree.outputs.ready == 'true'
        shell: pwsh
        run: |
          if (Get-Command rtk -ErrorAction SilentlyContinue) {
            rtk proxy python scripts/check_brand_assets.py
          } else {
            python scripts/check_brand_assets.py
          }
      - name: Compile source
        if: steps.testable_tree.outputs.ready == 'true'
        shell: pwsh
        run: |
          if (Get-Command rtk -ErrorAction SilentlyContinue) {
            rtk proxy python -m compileall -q src
          } else {
            python -m compileall -q src
          }
      - name: Verify clean tree
        if: steps.testable_tree.outputs.ready == 'true'
        shell: pwsh
        run: |
          git diff --exit-code
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          $status = git status --porcelain --untracked-files=all
          if ($status) {
            $status
            exit 1
          }

