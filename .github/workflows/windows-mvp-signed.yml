name: Windows MVP trusted-signature acceptance

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  signed-msix-fresh-runner:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      AGENTGUARDIAN_MCP_ADAPTER_URL: ${{ vars.AGENTGUARDIAN_MCP_ADAPTER_URL }}
      AGENTGUARDIAN_MCP_ADAPTER_SHA256: ${{ vars.AGENTGUARDIAN_MCP_ADAPTER_SHA256 }}
      AGENTGUARDIAN_MCP_ADAPTER_PUBLISHER: ${{ vars.AGENTGUARDIAN_MCP_ADAPTER_PUBLISHER }}
      AGENTGUARDIAN_MCP_ADAPTER_CERTIFICATE_SHA256: ${{ vars.AGENTGUARDIAN_MCP_ADAPTER_CERTIFICATE_SHA256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
          cache: pip

      - name: Fail closed when trusted signing material is absent
        env:
          SIGNING_PFX_B64: ${{ secrets.AGENTGUARDIAN_SIGNING_PFX_B64 }}
          SIGNING_PFX_PASSWORD: ${{ secrets.AGENTGUARDIAN_SIGNING_PFX_PASSWORD }}
          SIGNING_PUBLISHER: ${{ secrets.AGENTGUARDIAN_SIGNING_PUBLISHER }}
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:SIGNING_PFX_B64) -or
              [string]::IsNullOrWhiteSpace($env:SIGNING_PFX_PASSWORD) -or
              [string]::IsNullOrWhiteSpace($env:SIGNING_PUBLISHER) -or
              [string]::IsNullOrWhiteSpace($env:AGENTGUARDIAN_MCP_ADAPTER_URL) -or
              [string]::IsNullOrWhiteSpace($env:AGENTGUARDIAN_MCP_ADAPTER_SHA256) -or
              [string]::IsNullOrWhiteSpace($env:AGENTGUARDIAN_MCP_ADAPTER_PUBLISHER) -or
              [string]::IsNullOrWhiteSpace($env:AGENTGUARDIAN_MCP_ADAPTER_CERTIFICATE_SHA256)) {
            throw "Trusted signing secrets and MCP adapter variables are required; unsigned fallback is forbidden"
          }
          $adapterUri = $null
          if (-not [Uri]::TryCreate(
              $env:AGENTGUARDIAN_MCP_ADAPTER_URL,
              [UriKind]::Absolute,
              [ref]$adapterUri
            ) -or $adapterUri.Scheme -ne "https") {
            throw "AGENTGUARDIAN_MCP_ADAPTER_URL must be an absolute HTTPS URL"
          }
          foreach ($digest in @(
              $env:AGENTGUARDIAN_MCP_ADAPTER_SHA256,
              $env:AGENTGUARDIAN_MCP_ADAPTER_CERTIFICATE_SHA256
            )) {
            if ($digest -cnotmatch '^[0-9a-f]{64}$') {
              throw "MCP adapter SHA-256 variables must be exact lowercase hex"
            }
          }
          if (
              $env:AGENTGUARDIAN_MCP_ADAPTER_PUBLISHER -cne $env:AGENTGUARDIAN_MCP_ADAPTER_PUBLISHER.Trim() -or
              -not $env:AGENTGUARDIAN_MCP_ADAPTER_PUBLISHER.Contains("=")
            ) {
            throw "AGENTGUARDIAN_MCP_ADAPTER_PUBLISHER must be a trimmed X.500 subject"
          }

      - name: Download and verify trusted MCP adapter
        shell: pwsh
        run: |
          $adapterOutput = @(python scripts/download_trusted_mcp_adapter.py `
            --url "$env:AGENTGUARDIAN_MCP_ADAPTER_URL" `
            --temporary-root "$env:RUNNER_TEMP" `
            --expected-sha256 "$env:AGENTGUARDIAN_MCP_ADAPTER_SHA256")
          if ($LASTEXITCODE -ne 0 -or $adapterOutput.Count -ne 1) {
            throw "trusted MCP adapter download did not return one verified path"
          }
          $adapterPath = [IO.Path]::GetFullPath([string]$adapterOutput[0])
          $runnerRoot = [IO.Path]::GetFullPath($env:RUNNER_TEMP).TrimEnd(
            [IO.Path]::DirectorySeparatorChar,
            [IO.Path]::AltDirectorySeparatorChar
          ) + [IO.Path]::DirectorySeparatorChar
          if (
              -not [IO.Path]::IsPathFullyQualified($adapterPath) -or
              [IO.Path]::GetFileName($adapterPath) -cne "AgentGuardianMcpAdapter.exe" -or
              -not $adapterPath.StartsWith($runnerRoot, [StringComparison]::OrdinalIgnoreCase) -or
              -not (Test-Path -LiteralPath $adapterPath -PathType Leaf)
            ) {
            throw "trusted MCP adapter downloader returned an invalid path"
          }
          "MCP_ADAPTER_PATH=$adapterPath" >> $env:GITHUB_ENV

      - name: Install hash-locked build dependencies
        shell: pwsh
        run: python -m pip install --require-hashes -r requirements-build.lock

      - name: Locate Windows SDK tools
        shell: pwsh
        run: |
          $makeappx = Get-ChildItem -LiteralPath "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Filter MakeAppx.exe -Recurse -File | Sort-Object FullName | Select-Object -Last 1
          $signtool = Get-ChildItem -LiteralPath "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Filter SignTool.exe -Recurse -File | Sort-Object FullName | Select-Object -Last 1
          if ($null -eq $makeappx -or $null -eq $signtool) { throw "MakeAppx.exe and SignTool.exe are required" }
          "MAKEAPPX=$($makeappx.FullName)" >> $env:GITHUB_ENV
          "SIGNTOOL=$($signtool.FullName)" >> $env:GITHUB_ENV

      - name: Build and stage signed package
        env:
          SIGNING_PUBLISHER: ${{ secrets.AGENTGUARDIAN_SIGNING_PUBLISHER }}
        shell: pwsh
        run: |
          $sha = (git rev-parse HEAD).Trim()
          $commitEpoch = [int64](git show -s --format=%ct HEAD)
          $builtAt = [DateTimeOffset]::FromUnixTimeSeconds($commitEpoch).UtcDateTime.ToString("yyyy-MM-ddTHH:mm:ssZ")
          python scripts/build_windows_portable.py `
            --output-root "$pwd\.analysis\signed-portable" `
            --source-commit $sha `
            --built-at $builtAt `
            --artifact-status trusted_release `
            --mcp-adapter-path "$env:MCP_ADAPTER_PATH" `
            --mcp-adapter-sha256 "$env:AGENTGUARDIAN_MCP_ADAPTER_SHA256" `
            --mcp-adapter-publisher "$env:AGENTGUARDIAN_MCP_ADAPTER_PUBLISHER" `
            --mcp-adapter-certificate-sha256 "$env:AGENTGUARDIAN_MCP_ADAPTER_CERTIFICATE_SHA256"
          python scripts/build_windows_msix.py `
            --bundle-root "$pwd\.analysis\signed-portable\dist\AgentGuardian" `
            --stage-root "$pwd\.analysis\signed-msix-stage" `
            --project-root "$pwd" `
            --identity-name "yangjing6213dev.AgentGuardian" `
            --publisher "$env:SIGNING_PUBLISHER" `
            --version "0.1.0.0"
          & $env:MAKEAPPX pack `
            /d "$pwd\.analysis\signed-msix-stage" `
            /p "$pwd\.analysis\AgentGuardian-signed.msix"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/build_windows_msix.py `
            --bundle-root "$pwd\.analysis\signed-portable\dist\AgentGuardian" `
            --stage-root "$pwd\.analysis\signed-upgrade-msix-stage" `
            --project-root "$pwd" `
            --identity-name "yangjing6213dev.AgentGuardian" `
            --publisher "$env:SIGNING_PUBLISHER" `
            --version "0.1.0.1"
          & $env:MAKEAPPX pack `
            /d "$pwd\.analysis\signed-upgrade-msix-stage" `
            /p "$pwd\.analysis\AgentGuardian-signed-upgrade.msix"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Sign with organization certificate and trusted timestamp
        env:
          SIGNING_PFX_B64: ${{ secrets.AGENTGUARDIAN_SIGNING_PFX_B64 }}
          SIGNING_PFX_PASSWORD: ${{ secrets.AGENTGUARDIAN_SIGNING_PFX_PASSWORD }}
        shell: pwsh
        run: |
          $pfxPath = Join-Path $env:RUNNER_TEMP "agentguardian-signing.pfx"
          $preexistingThumbprints = @()
          $preImportSnapshotComplete = $false
          $importedCertificates = @()
          $signingCertificate = $null
          $securePassword = $null
          $cleanupFailures = [System.Collections.Generic.List[string]]::new()
          try {
            $preexistingThumbprints = @(
              Get-ChildItem -LiteralPath Cert:\CurrentUser\My -ErrorAction Stop |
                ForEach-Object { ([string]$_.Thumbprint).ToUpperInvariant() } |
                Where-Object { $_ -cmatch '^[0-9A-F]{40}$' }
            )
            $preImportSnapshotComplete = $true
            [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:SIGNING_PFX_B64))
            $securePassword = ConvertTo-SecureString $env:SIGNING_PFX_PASSWORD -AsPlainText -Force
            $importedCertificates = @(Import-PfxCertificate -FilePath $pfxPath -CertStoreLocation Cert:\CurrentUser\My -Password $securePassword)
            $signingCertificate = $importedCertificates | Where-Object { $_.HasPrivateKey } | Select-Object -First 1
            if ($null -eq $signingCertificate) { throw "Signing certificate import failed" }
            # signtool sign /fd SHA256 /sha1 /tr /td SHA256
            foreach ($packagePath in @(
                "$pwd\.analysis\AgentGuardian-signed.msix",
                "$pwd\.analysis\AgentGuardian-signed-upgrade.msix"
              )) {
              & $env:SIGNTOOL sign /fd SHA256 /sha1 $signingCertificate.Thumbprint /tr "http://timestamp.digicert.com" /td SHA256 $packagePath
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            }
          }
          finally {
            $targetThumbprints = @(
              foreach ($importedCertificate in $importedCertificates) {
                $thumbprint = [string]$importedCertificate.Thumbprint
                if ($thumbprint -cmatch '^[0-9A-Fa-f]{40}$') {
                  $thumbprint.ToUpperInvariant()
                }
              }
            )
            $postImportThumbprints = @()
            try {
              $postImportThumbprints = @(
                Get-ChildItem -LiteralPath Cert:\CurrentUser\My -ErrorAction Stop |
                  ForEach-Object { ([string]$_.Thumbprint).ToUpperInvariant() } |
                  Where-Object { $_ -cmatch '^[0-9A-F]{40}$' }
              )
              if ($preImportSnapshotComplete) {
                $newThumbprints = @(
                  $postImportThumbprints |
                    Where-Object { $_ -notin $preexistingThumbprints }
                )
                $targetThumbprints = @(
                  $targetThumbprints
                  $newThumbprints
                ) | Sort-Object -Unique
              }
              else {
                [void]$cleanupFailures.Add("pre-import-store-query")
              }
            }
            catch {
              [void]$cleanupFailures.Add("post-import-store-query")
            }
            foreach ($thumbprint in $targetThumbprints) {
              $certificatePath = "Cert:\CurrentUser\My\$thumbprint"
              try {
                Remove-Item -LiteralPath $certificatePath -DeleteKey -Force -ErrorAction Stop
              }
              catch {
                [void]$cleanupFailures.Add("certificate-removal")
              }
            }
            try {
              Remove-Item -LiteralPath $pfxPath -Force -ErrorAction Stop
            }
            catch {
              [void]$cleanupFailures.Add("pfx-removal")
            }
            foreach ($thumbprint in $targetThumbprints) {
              $certificatePath = "Cert:\CurrentUser\My\$thumbprint"
              try {
                if (Test-Path -LiteralPath $certificatePath -ErrorAction Stop) {
                  [void]$cleanupFailures.Add("certificate-residue")
                }
              }
              catch {
                [void]$cleanupFailures.Add("certificate-recheck")
              }
            }
            try {
              if (Test-Path -LiteralPath $pfxPath -ErrorAction Stop) {
                [void]$cleanupFailures.Add("pfx-residue")
              }
            }
            catch {
              [void]$cleanupFailures.Add("pfx-recheck")
            }
            $securePassword = $null
            if ($cleanupFailures.Count -ne 0) {
              throw "SIGNING_MATERIAL_CLEANUP_FAILED"
            }
          }

      - name: Install launch and uninstall trusted signed MSIX on fresh runner
        env:
          SIGNING_PUBLISHER: ${{ secrets.AGENTGUARDIAN_SIGNING_PUBLISHER }}
        shell: pwsh
        run: |
          $sha = (git rev-parse HEAD).Trim()
          $mcpAdapterEvidence = "$pwd\.analysis\mcp-adapter-acceptance.json"
          .\scripts\verify_windows_msix.ps1 `
            -PackagePath "$pwd\.analysis\AgentGuardian-signed.msix" `
            -PackageName "yangjing6213dev.AgentGuardian" `
            -ExpectedSourceCommit $sha `
            -UpgradePackagePath "$pwd\.analysis\AgentGuardian-signed-upgrade.msix" `
            -EvidencePath "$pwd\.analysis\signed-msix-smoke.json" `
            -ExpectedPublisher "$env:SIGNING_PUBLISHER" `
            -RequireTrustedSignature `
            -RequireFreshUserState `
            -RequireMcpAdapterAcceptance `
            -McpAdapterRelativePath "adapters/AgentGuardianMcpAdapter.exe" `
            -ExpectedMcpAdapterSha256 "$env:AGENTGUARDIAN_MCP_ADAPTER_SHA256" `
            -ExpectedMcpAdapterPublisher "$env:AGENTGUARDIAN_MCP_ADAPTER_PUBLISHER" `
            -ExpectedMcpAdapterCertificateSha256 "$env:AGENTGUARDIAN_MCP_ADAPTER_CERTIFICATE_SHA256" `
            -McpAdapterEvidencePath $mcpAdapterEvidence `
            -SmokeSeconds 4

      - name: Enforce final trusted release evidence gate
        shell: pwsh
        run: |
          $sha = (git rev-parse HEAD).Trim()
          python scripts/verify_windows_release_candidate.py `
            --bundle-root "$pwd\.analysis\signed-portable\dist\AgentGuardian" `
            --smoke-evidence "$pwd\.analysis\signed-msix-smoke.json" `
            --mcp-adapter-evidence "$pwd\.analysis\mcp-adapter-acceptance.json" `
            --expected-source-commit $sha `
            --require-trusted-signature `
            --require-fresh-user-state `
            --license-review "$pwd\docs\security\windows-license-review.json"

      - name: Print signed package digest
        shell: pwsh
        run: |
          Get-FileHash -Algorithm SHA256 -LiteralPath "$pwd\.analysis\AgentGuardian-signed.msix"
          Get-FileHash -Algorithm SHA256 -LiteralPath "$pwd\.analysis\AgentGuardian-signed-upgrade.msix"
