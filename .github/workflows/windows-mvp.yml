name: Windows MVP package verification

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  msix-development-install:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
          cache: pip

      - name: Install hash-locked development dependencies
        shell: pwsh
        run: python -m pip install --require-hashes -r requirements-dev.lock

      - name: Run full test suite
        shell: pwsh
        run: python -m pytest -q -p no:cacheprovider

      - name: Install hash-locked build dependencies
        shell: pwsh
        run: python -m pip install --require-hashes -r requirements-build.lock

      - name: Locate Windows SDK packaging tools
        shell: pwsh
        run: |
          $makeappx = Get-ChildItem -LiteralPath "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Filter MakeAppx.exe -Recurse -File | Sort-Object FullName | Select-Object -Last 1
          $signtool = Get-ChildItem -LiteralPath "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Filter SignTool.exe -Recurse -File | Sort-Object FullName | Select-Object -Last 1
          if ($null -eq $makeappx -or $null -eq $signtool) {
            throw "Windows SDK MakeAppx.exe and SignTool.exe are required"
          }
          "MAKEAPPX=$($makeappx.FullName)" >> $env:GITHUB_ENV
          "SIGNTOOL=$($signtool.FullName)" >> $env:GITHUB_ENV

      - name: Build portable source package
        shell: pwsh
        run: |
          $sha = (git rev-parse HEAD).Trim()
          $builtAt = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
          python scripts/build_windows_portable.py `
            --output-root "$pwd\.analysis\ci-portable" `
            --source-commit $sha `
            --built-at $builtAt

      - name: Stage MSIX package
        shell: pwsh
        run: |
          python scripts/build_windows_msix.py `
            --bundle-root "$pwd\.analysis\ci-portable\dist\AgentGuardian" `
            --stage-root "$pwd\.analysis\ci-msix-stage" `
            --project-root "$pwd" `
            --identity-name "yangjing6213dev.AgentGuardian" `
            --publisher "CN=AgentGuardian CI Test" `
            --version "0.1.0.0"
          & $env:MAKEAPPX pack `
            /d "$pwd\.analysis\ci-msix-stage" `
            /p "$pwd\.analysis\AgentGuardian-ci.msix"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Sign with ephemeral CI certificate for install smoke only
        timeout-minutes: 5
        shell: pwsh
        run: |
          $publisher = "CN=AgentGuardian CI Test"
          $certPath = "$pwd\.analysis\agentguardian-ci.cer"
          $pfxPath = "$pwd\.analysis\agentguardian-ci.pfx"
          $pfxPassword = [Guid]::NewGuid().ToString("N")
          $rsa = $null
          $cert = $null
          try {
            function Invoke-BoundedProcess {
              param(
                [Parameter(Mandatory = $true)][string]$FilePath,
                [Parameter(Mandatory = $true)][string[]]$Arguments,
                [int]$TimeoutMilliseconds = 120000
              )
              $startInfo = [System.Diagnostics.ProcessStartInfo]::new()
              $startInfo.FileName = $FilePath
              $startInfo.UseShellExecute = $false
              foreach ($argument in $Arguments) {
                [void]$startInfo.ArgumentList.Add($argument)
              }
              $process = [System.Diagnostics.Process]::new()
              $process.StartInfo = $startInfo
              if (-not $process.Start()) { throw "Unable to start $FilePath" }
              if (-not $process.WaitForExit($TimeoutMilliseconds)) {
                $process.Kill($true)
                throw "$FilePath exceeded the bounded timeout"
              }
              if ($process.ExitCode -ne 0) {
                throw "$FilePath exited with code $($process.ExitCode)"
              }
            }

            Write-Host "Creating ephemeral signing certificate with .NET CertificateRequest"
            $rsa = [System.Security.Cryptography.RSA]::Create(2048)
            $request = [System.Security.Cryptography.X509Certificates.CertificateRequest]::new(
              $publisher,
              $rsa,
              [System.Security.Cryptography.HashAlgorithmName]::SHA256,
              [System.Security.Cryptography.RSASignaturePadding]::Pkcs1
            )
            $request.CertificateExtensions.Add(
              [System.Security.Cryptography.X509Certificates.X509KeyUsageExtension]::new(
                [System.Security.Cryptography.X509Certificates.X509KeyUsageFlags]::DigitalSignature,
                $true
              )
            )
            $ekuOids = [System.Security.Cryptography.OidCollection]::new()
            $ekuOids.Add([System.Security.Cryptography.Oid]::new("1.3.6.1.5.5.7.3.3", "Code Signing"))
            $request.CertificateExtensions.Add(
              [System.Security.Cryptography.X509Certificates.X509EnhancedKeyUsageExtension]::new($ekuOids, $true)
            )
            $cert = $request.CreateSelfSigned((Get-Date).AddMinutes(-5), (Get-Date).AddDays(1))
            [System.IO.File]::WriteAllBytes(
              $certPath,
              $cert.Export([System.Security.Cryptography.X509Certificates.X509ContentType]::Cert)
            )
            [System.IO.File]::WriteAllBytes(
              $pfxPath,
              $cert.Export([System.Security.Cryptography.X509Certificates.X509ContentType]::Pfx, $pfxPassword)
            )
            Import-Certificate -FilePath $certPath -CertStoreLocation Cert:\CurrentUser\TrustedPeople | Out-Null
            Import-Certificate -FilePath $certPath -CertStoreLocation Cert:\CurrentUser\Root | Out-Null
            Write-Host "Signing MSIX with ephemeral PFX"
            Invoke-BoundedProcess $env:SIGNTOOL @(
              "sign", "/fd", "SHA256", "/f", $pfxPath, "/p", $pfxPassword,
              "$pwd\.analysis\AgentGuardian-ci.msix"
            )
            Write-Host "Verifying MSIX signature"
            Invoke-BoundedProcess $env:SIGNTOOL @(
              "verify", "/pa", "/all", "$pwd\.analysis\AgentGuardian-ci.msix"
            )
          }
          finally {
            if ($null -ne $cert) {
              Remove-Item -LiteralPath "Cert:\CurrentUser\TrustedPeople\$($cert.Thumbprint)" -Force -ErrorAction SilentlyContinue
              Remove-Item -LiteralPath "Cert:\CurrentUser\Root\$($cert.Thumbprint)" -Force -ErrorAction SilentlyContinue
            }
            Remove-Item -LiteralPath $certPath -Force -ErrorAction SilentlyContinue
            Remove-Item -LiteralPath $pfxPath -Force -ErrorAction SilentlyContinue
            if ($null -ne $rsa) { $rsa.Dispose() }
          }

      - name: Install launch and uninstall MSIX as standard user
        shell: pwsh
        run: |
          .\scripts\verify_windows_msix.ps1 `
            -PackagePath "$pwd\.analysis\AgentGuardian-ci.msix" `
            -PackageName "yangjing6213dev.AgentGuardian" `
            -EvidencePath "$pwd\.analysis\ci-msix-smoke.json" `
            -SmokeSeconds 4
          Get-Content -LiteralPath "$pwd\.analysis\ci-msix-smoke.json"

      - name: Print exact package digest
        shell: pwsh
        run: Get-FileHash -Algorithm SHA256 -LiteralPath "$pwd\.analysis\AgentGuardian-ci.msix"
