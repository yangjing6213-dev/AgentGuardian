name: Windows MVP package verification

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  msix-development-install:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
          cache: pip

      - name: Install hash-locked development dependencies
        shell: pwsh
        run: python -m pip install --require-hashes -r requirements-dev.lock

      - name: Run full test suite
        shell: pwsh
        run: python -m pytest -q -p no:cacheprovider

      - name: Install hash-locked build dependencies
        shell: pwsh
        run: python -m pip install --require-hashes -r requirements-build.lock

      - name: Locate Windows SDK packaging tools
        shell: pwsh
        run: |
          $makeappx = Get-ChildItem -LiteralPath "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Filter MakeAppx.exe -Recurse -File | Sort-Object FullName | Select-Object -Last 1
          if ($null -eq $makeappx) {
            throw "Windows SDK MakeAppx.exe is required"
          }
          "MAKEAPPX=$($makeappx.FullName)" >> $env:GITHUB_ENV

      - name: Build portable source package
        shell: pwsh
        run: |
          $sha = (git rev-parse HEAD).Trim()
          $commitEpoch = [int64](git show -s --format=%ct HEAD)
          $builtAt = [DateTimeOffset]::FromUnixTimeSeconds($commitEpoch).UtcDateTime.ToString("yyyy-MM-ddTHH:mm:ssZ")
          python scripts/build_windows_portable.py `
            --output-root "$pwd\.analysis\ci-portable" `
            --source-commit $sha `
            --built-at $builtAt

      - name: Stage MSIX package
        shell: pwsh
        run: |
          python scripts/build_windows_msix.py `
            --bundle-root "$pwd\.analysis\ci-portable\dist\AgentGuardian" `
            --stage-root "$pwd\.analysis\ci-msix-stage" `
            --project-root "$pwd" `
            --identity-name "yangjing6213dev.AgentGuardian" `
            --publisher "CN=AgentGuardian CI Test, OID.2.25.311729368913984317654407730594956997722=1" `
            --version "0.1.0.0"
          & $env:MAKEAPPX pack `
            /d "$pwd\.analysis\ci-msix-stage" `
            /p "$pwd\.analysis\AgentGuardian-ci.msix"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/build_windows_msix.py `
            --bundle-root "$pwd\.analysis\ci-portable\dist\AgentGuardian" `
            --stage-root "$pwd\.analysis\ci-msix-upgrade-stage" `
            --project-root "$pwd" `
            --identity-name "yangjing6213dev.AgentGuardian" `
            --publisher "CN=AgentGuardian CI Test, OID.2.25.311729368913984317654407730594956997722=1" `
            --version "0.1.0.1"
          & $env:MAKEAPPX pack `
            /d "$pwd\.analysis\ci-msix-upgrade-stage" `
            /p "$pwd\.analysis\AgentGuardian-ci-upgrade.msix"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install launch and uninstall unsigned MSIX CI smoke (same-identity upgrade and uninstall)
        shell: pwsh
        run: |
          .\scripts\verify_windows_msix.ps1 `
            -PackagePath "$pwd\.analysis\AgentGuardian-ci.msix" `
            -PackageName "yangjing6213dev.AgentGuardian" `
            -UpgradePackagePath "$pwd\.analysis\AgentGuardian-ci-upgrade.msix" `
            -EvidencePath "$pwd\.analysis\ci-msix-smoke.json" `
            -AllowUnsigned `
            -SmokeSeconds 4
          Get-Content -LiteralPath "$pwd\.analysis\ci-msix-smoke.json"

      - name: Print exact package digest
        shell: pwsh
        run: |
          Get-FileHash -Algorithm SHA256 -LiteralPath "$pwd\.analysis\AgentGuardian-ci.msix"
          Get-FileHash -Algorithm SHA256 -LiteralPath "$pwd\.analysis\AgentGuardian-ci-upgrade.msix"
