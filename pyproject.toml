[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "agentguardian"
version = "0.1.0"
description = "Local-first AI agent data security auditor"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
    "PySide6>=6.8,<7",
]

[project.optional-dependencies]
dev = [
    "Pillow>=11",
    "pytest>=8",
]

[project.urls]
Repository = "https://github.com/yangjing6213-dev/AgentGuardian"
Issues = "https://github.com/yangjing6213-dev/AgentGuardian/issues"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agentguardian = ["rules/*.json", "source_policy.json"]
